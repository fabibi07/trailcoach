[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trailcoach"
version = "0.1.0"
description = "Plataforma personal de análisis de entrenamiento running/trail + AI Coach"
requires-python = ">=3.10"
authors = [
    {name = "Fabian", email = "parada2293@gmail.com"},
]
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "garmin-fit-sdk>=21.0.0",
    "fitdecode>=0.10.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "polars>=0.20.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "structlog>=24.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
trailcoach = "trailcoach.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/trailcoach"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
